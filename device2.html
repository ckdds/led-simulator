<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>LED Simulator - Device 2</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <!-- 장치 2 -->
    <div class="device">
      <div class="legend">
        <h2 class="legend__title">ID별 LED 점멸 방법</h2>
        <div class="legend__list">
          <div class="legend__row"><span class="legend__id">ID 1</span><span class="legend__dots"><span class="dot dot-red"></span></span></div>
          <div class="legend__row"><span class="legend__id">ID 2</span><span class="legend__dots"><span class="dot dot-red"></span><span class="dot dot-red"></span></span></div>
          <div class="legend__row"><span class="legend__id">ID 3</span><span class="legend__dots"><span class="dot dot-red"></span><span class="dot dot-red"></span><span class="dot dot-red"></span></span></div>
          <div class="legend__row"><span class="legend__id">ID 4</span><span class="legend__dots"><span class="dot dot-red"></span><span class="dot dot-red"></span><span class="dot dot-red"></span><span class="dot dot-red"></span></span></div>
          <div class="legend__row"><span class="legend__id">ID 5</span><span class="legend__dots"><span class="dot dot-green"></span></span></div>
          <div class="legend__row"><span class="legend__id">ID 6</span><span class="legend__dots"><span class="dot dot-green"></span><span class="dot dot-red"></span></span></div>
          <div class="legend__row"><span class="legend__id">ID 7</span><span class="legend__dots"><span class="dot dot-green"></span><span class="dot dot-red"></span><span class="dot dot-red"></span></span></div>
          <div class="legend__row"><span class="legend__id">ID 8</span><span class="legend__dots"><span class="dot dot-green"></span><span class="dot dot-red"></span><span class="dot dot-red"></span><span class="dot dot-red"></span></span></div>
          <div class="legend__row"><span class="legend__id">ID 9</span><span class="legend__dots"><span class="dot dot-green"></span><span class="dot dot-red"></span><span class="dot dot-red"></span><span class="dot dot-red"></span><span class="dot dot-red"></span></span></div>
          <div class="legend__row"><span class="legend__id">ID 10</span><span class="legend__dots"><span class="dot dot-green"></span><span class="dot dot-green"></span></span></div>
        </div>
      </div>

      <div class="stage-wrapper">
        <p class="device-desc">ID 숫자를 녹색 LED로 5진법으로 표시</p>
        <p class="id-label" id="idLabel2">ID : 1</p>

        <div class="stage">
          <div class="part">
            <p class="label">LED</p>
            <div class="led" id="led2"></div>
          </div>

          <div class="part">
            <p class="label">Button</p>
            <div class="button" id="idButton2"></div>
          </div>
        </div>
      </div>

      <div class="settings">
        <h2 class="settings__title">Timing Settings</h2>

        <label class="settings__row">
          <span>적색 LED ON TIME (ms)</span>
          <input type="text" id="redOnTimeInput2" inputmode="numeric" value="400" />
        </label>

        <label class="settings__row">
          <span>적색 LED OFF TIME (ms)</span>
          <input type="text" id="redOffTimeInput2" inputmode="numeric" value="400" />
        </label>

        <label class="settings__row">
          <span>녹색 LED ON TIME (ms)</span>
          <input type="text" id="greenOnTimeInput2" inputmode="numeric" value="400" />
        </label>

        <label class="settings__row">
          <span>녹색 LED OFF TIME (ms)</span>
          <input type="text" id="greenOffTimeInput2" inputmode="numeric" value="400" />
        </label>

        <label class="settings__row">
          <span>INTERVAL (ms)</span>
          <input type="text" id="intervalInput2" inputmode="numeric" value="1200" />
        </label>
      </div>
    </div>

    <a class="nav-button" href="index.html">LED 점멸 방법1로 이동</a>
  </div>

  <script src="script.js"></script>
</body>
</html>
