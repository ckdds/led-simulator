<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>LED Simulator - 정격 전류 설정</title>
<link rel="stylesheet" href="style.css" />
<style>
  .cur-set {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 28px;
    background: #20242b;
    border: 1px solid #333941;
    border-radius: 16px;
    padding: 32px 40px;
  }

  .cur-set__title {
    margin: 0;
    color: #e8ecf1;
    font-size: 1.1rem;
  }

  .dial-wrap {
    position: relative;
    width: 380px;
    height: 280px;
  }

  .dial-arc {
    width: 100%;
    height: 100%;
  }

  .dial-arc__track {
    fill: none;
    stroke: #454c56;
    stroke-width: 6;
    stroke-linecap: round;
  }

  .dial-tick {
    stroke: #6b7480;
    stroke-width: 3;
    stroke-linecap: round;
  }

  .dial-label {
    fill: #9aa4b2;
    font-size: 15px;
    font-family: sans-serif;
  }

  .dial-label--top { text-anchor: middle; }
  .dial-label--left { text-anchor: end; }
  .dial-label--right { text-anchor: start; }

  .knob {
    position: absolute;
    left: 190px;
    top: 140px;
    width: 96px;
    height: 96px;
    margin: -48px 0 0 -48px;
    border-radius: 50%;
    background: linear-gradient(160deg, #5b6470, #333941);
    box-shadow: 0 4px 0 #1c1f24, inset 0 0 0 1px #6b7480;
    transform: rotate(-135deg);
  }

  .knob__pointer {
    position: absolute;
    top: 3px;
    left: 50%;
    width: 16px;
    height: 81px;
    transform: translateX(-50%);
    filter: drop-shadow(0 0 4px rgba(77, 163, 255, 0.7));
  }

  .knob__pointer::before {
    content: '';
    position: absolute;
    top: 0;
    left: 50%;
    width: 0;
    height: 0;
    border-left: 8px solid transparent;
    border-right: 8px solid transparent;
    border-bottom: 14px solid #4da3ff;
    transform: translateX(-50%);
  }

  .knob__pointer::after {
    content: '';
    position: absolute;
    top: 12px;
    left: 50%;
    width: 4px;
    height: 69px;
    background: #4da3ff;
    border-radius: 2px;
    transform: translateX(-50%);
  }

  .cur-set__readout {
    margin: 0;
    color: #e8ecf1;
    font-size: 0.95rem;
    letter-spacing: 0.03em;
  }

  .cur-set__hint {
    margin: 0;
    color: #6b7480;
    font-size: 0.8rem;
  }

  .pot-slider {
    width: 260px;
    accent-color: #4da3ff;
  }

  .cur-set__body {
    display: flex;
    align-items: center;
    gap: 40px;
  }

  .cur-set__controls {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 20px;
  }

  .cur-set__output {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
  }

  .cur-set__current-control {
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .cur-set__current-control input {
    width: 90px;
  }

  .cur-set__step-btn {
    height: 28px;
    padding: 0 8px;
    flex-shrink: 0;
    border-radius: 6px;
    border: 1px solid #454c56;
    background: #2b3038;
    color: #e8ecf1;
    font-size: 0.8rem;
    line-height: 1;
    cursor: pointer;
    white-space: nowrap;
  }

  .cur-set__step-btn--fine {
    font-size: 0.7rem;
    color: #9aa4b2;
  }

  .cur-set__step-btn:hover {
    background: #3a4048;
  }

  .cur-set__step-btn:active {
    background: #1b1f24;
  }

  .cur-set__nav-row {
    display: flex;
    align-items: center;
    gap: 12px;
  }
</style>
</head>
<body>
  <div class="app">
    <div class="cur-set">
      <h2 class="cur-set__title">정격 전류 설정</h2>

      <div class="cur-set__body">
        <div class="cur-set__controls">
          <div class="dial-wrap">
            <svg class="dial-arc" viewBox="0 0 380 280">
              <path class="dial-arc__track" d="M119.29 210.71 A100 100 0 1 1 260.71 210.71" />
              <line class="dial-tick" x1="119.29" y1="210.71" x2="106.56" y2="223.44" />
              <line class="dial-tick" x1="260.71" y1="210.71" x2="273.44" y2="223.44" />
              <line class="dial-tick" x1="90" y1="140" x2="72" y2="140" />
              <line class="dial-tick" x1="290" y1="140" x2="308" y2="140" />
              <line class="dial-tick" x1="168.39" y1="42.36" x2="164.50" y2="24.79" />
              <line class="dial-tick" x1="244.27" y1="56.01" x2="254.04" y2="40.89" />
              <line class="dial-tick" x1="280.65" y1="97.78" x2="296.97" y2="90.18" />
              <text class="dial-label dial-label--left" x="66" y="145">0.3</text>
              <text class="dial-label dial-label--left" x="158" y="20">0.6</text>
              <text class="dial-label dial-label--right" x="260" y="36">0.9</text>
              <text class="dial-label dial-label--right" x="302" y="94">1.2</text>
              <text class="dial-label dial-label--right" x="314" y="145">1.5</text>
            </svg>
            <div class="knob" id="knob">
              <div class="knob__pointer"></div>
            </div>
          </div>

          <input type="range" id="slider" class="pot-slider" min="0" max="270" step="1" value="45" />
          <p class="cur-set__hint">(슬라이드 바를 클릭하고 좌우 화살표로 조정하세요)</p>
          <p class="cur-set__readout" id="readout">ADC 값: 0</p>
          <p class="cur-set__readout" id="currentReadout">전류: 0.30 A</p>
          <p class="cur-set__readout" id="adcDiffReadout">ADC+40 전류 차이: 0.0000 A</p>
        </div>

        <div class="cur-set__output part">
          <p class="label">LED</p>
          <div class="led" id="led"></div>

          <label class="settings__row">
            <span>현재 인가 전류값 (A)</span>
            <div class="cur-set__current-control">
              <button type="button" id="currentDown" class="cur-set__step-btn" title="0.1A 감소">−0.1</button>
              <button type="button" id="currentDownFine" class="cur-set__step-btn cur-set__step-btn--fine" title="0.01A 감소">−0.01</button>
              <input type="text" id="currentInput" inputmode="decimal" placeholder="0.00" />
              <button type="button" id="currentUpFine" class="cur-set__step-btn cur-set__step-btn--fine" title="0.01A 증가">+0.01</button>
              <button type="button" id="currentUp" class="cur-set__step-btn" title="0.1A 증가">+0.1</button>
            </div>
          </label>
        </div>
      </div>
    </div>

    <div class="cur-set__nav-row">
      <a class="nav-button" href="rated_cur1p5.html">1.5A 선형</a>
      <a class="nav-button" href="rated_cur22.html">22A 선형</a>
      <a class="nav-button" href="rated_cur1p5new.html">1.5A 비선형</a>
      <a class="nav-button" href="rated_cur22new.html">22A 비선형</a>
      <a class="nav-button" href="rated_cur22pro.html">22A 실제 구현</a>
    </div>
  </div>

  <script>
    const slider = document.getElementById('slider');
    const knob = document.getElementById('knob');
    const readout = document.getElementById('readout');
    const currentReadout = document.getElementById('currentReadout');
    const adcDiffReadout = document.getElementById('adcDiffReadout');
    const currentInput = document.getElementById('currentInput');
    const currentUp = document.getElementById('currentUp');
    const currentDown = document.getElementById('currentDown');
    const currentUpFine = document.getElementById('currentUpFine');
    const currentDownFine = document.getElementById('currentDownFine');
    const led = document.getElementById('led');

    let settingCurrent = 0.3;

    function degToCurrent(deg) {
      // 0.3A는 45도 눈금, 1.5A는 225도 눈금 기준으로 지수(로그) 환산 (범위 밖은 0.3~1.5로 고정)
      // 같은 각도(같은 ADC 스텝)만큼 돌리면 현재 값 대비 항상 같은 비율로 전류가 변한다.
      const rawCurrent = 0.3 * Math.pow(1.5 / 0.3, (deg - 45) / 180);
      return Math.min(1.5, Math.max(0.3, rawCurrent));
    }

    function adcToCurrent(adc) {
      const clampedAdc = Math.min(4095, Math.max(0, adc));
      const deg = (clampedAdc / 4095) * 270;
      return degToCurrent(deg);
    }

    let blinkInterval = null;

    function stopBlink() {
      if (blinkInterval) {
        clearInterval(blinkInterval);
        blinkInterval = null;
      }
      led.classList.remove('on-red');
    }

    function startBlink() {
      if (blinkInterval) return;
      led.classList.add('on-red');
      let visible = true;
      blinkInterval = setInterval(() => {
        visible = !visible;
        led.classList.toggle('on-red', visible);
      }, 400);
    }

    let tripped = false;

    function updateLed() {
      const measured = parseFloat(currentInput.value);
      const measuredCurrent = Number.isNaN(measured) ? 0 : measured;
      const tripThreshold = settingCurrent * 1.05;
      const resetThreshold = settingCurrent * 1.0;

      if (!tripped && measuredCurrent >= tripThreshold) {
        tripped = true;
      } else if (tripped && measuredCurrent <= resetThreshold) {
        tripped = false;
      }

      if (tripped) {
        led.classList.remove('on-green');
        startBlink();
      } else {
        stopBlink();
        led.classList.add('on-green');
      }
    }

    function update(value) {
      const deg = Number(value);
      const angle = -135 + deg;
      const adc = Math.round((deg / 270) * 4095);
      settingCurrent = degToCurrent(deg);
      const currentAtAdcPlus40 = adcToCurrent(adc + 40);
      const inFlatRange = deg < 45 || currentAtAdcPlus40 >= 1.5;
      const adcStepDiff = inFlatRange ? 0 : currentAtAdcPlus40 - adcToCurrent(adc);
      const adcStepDiffPercent = inFlatRange ? 0 : (adcStepDiff / settingCurrent) * 100;
      knob.style.transform = `rotate(${angle}deg)`;
      readout.textContent = `ADC 값: ${adc}`;
      currentReadout.textContent = `설정 전류: ${settingCurrent.toFixed(2)} A`;
      adcDiffReadout.textContent = `ADC+40 전류 차이: ${adcStepDiff.toFixed(4)} A (${adcStepDiffPercent.toFixed(2)}%)`;
      updateLed();
    }

    function stepCurrent(delta) {
      const base = parseFloat(currentInput.value);
      const next = Math.max(0, Math.round(((Number.isNaN(base) ? 0 : base) + delta) * 100) / 100);
      currentInput.value = next.toFixed(2);
      updateLed();
    }

    slider.addEventListener('input', (e) => update(e.target.value));
    currentInput.addEventListener('input', updateLed);
    currentUp.addEventListener('click', () => stepCurrent(0.1));
    currentDown.addEventListener('click', () => stepCurrent(-0.1));
    currentUpFine.addEventListener('click', () => stepCurrent(0.01));
    currentDownFine.addEventListener('click', () => stepCurrent(-0.01));

    update(slider.value);
  </script>
</body>
</html>
