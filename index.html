<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>LED Simulator</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <!-- 장치 1 -->
    <div class="device">
      <div class="stage-wrapper">
        <p class="device-desc">ID 숫자만큼 적색 LED가 점멸</p>
        <p class="id-label" id="idLabel1">ID : 1</p>

        <div class="stage">
          <div class="part">
            <p class="label">LED</p>
            <div class="led" id="led1"></div>
          </div>

          <div class="part">
            <p class="label">Button</p>
            <div class="button" id="idButton1"></div>
          </div>
        </div>
      </div>

      <div class="settings">
        <h2 class="settings__title">Timing Settings</h2>

        <label class="settings__row">
          <span>LED ON TIME (ms)</span>
          <input type="text" id="onTimeInput1" inputmode="numeric" value="400" />
        </label>

        <label class="settings__row">
          <span>LED OFF TIME (ms)</span>
          <input type="text" id="offTimeInput1" inputmode="numeric" value="400" />
        </label>

        <label class="settings__row">
          <span>INTERVAL (ms)</span>
          <input type="text" id="intervalInput1" inputmode="numeric" value="1200" />
        </label>
      </div>
    </div>

    <!-- 장치 2 -->
    <div class="device">
      <div class="stage-wrapper">
        <p class="device-desc">ID 숫자를 녹색 LED로 5진법으로 표시</p>
        <p class="id-label" id="idLabel2">ID : 1</p>

        <div class="stage">
          <div class="part">
            <p class="label">LED</p>
            <div class="led" id="led2"></div>
          </div>

          <div class="part">
            <p class="label">Button</p>
            <div class="button" id="idButton2"></div>
          </div>
        </div>
      </div>

      <div class="settings">
        <h2 class="settings__title">Timing Settings</h2>

        <label class="settings__row">
          <span>LED ON TIME (ms)</span>
          <input type="text" id="onTimeInput2" inputmode="numeric" value="400" />
        </label>

        <label class="settings__row">
          <span>LED OFF TIME (ms)</span>
          <input type="text" id="offTimeInput2" inputmode="numeric" value="400" />
        </label>

        <label class="settings__row">
          <span>INTERVAL (ms)</span>
          <input type="text" id="intervalInput2" inputmode="numeric" value="1200" />
        </label>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
